<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wikipedia Viewer</title>
  <link rel="stylesheet" href="/frontend/CSS/style.css" />
  <link rel="stylesheet" href="/frontend/CSS/homepage.css">
</head>
<body>
  <div id="userEmailDisplay" style="font-weight: 600; margin-bottom: 1rem;"></div>
  <!-- Navbar -->
  <div class="navbar">
    <div class="logo-container">
      <img src="photos/LHICON.png" alt="Logo" class="logo" />
      <span class="site-title">LearnHub</span>
    </div>
    <nav>
      <ul>
        <li><a href="/frontend/homepage.html">Home</a></li>
        <li><a href="/frontend/explorehub.html">Explore</a></li>
        <li><a href="/frontend/Numberfacts.html">Number Facts</a></li>
        <li><a href="/frontend/Dictionary.html">Dictionary</a></li>
        <li><a href="/frontend/quiz.html">Quiz</a></li>
        <li><a href="/frontend/scheduler.html">Scheduler</a></li>
        <li><button id="logoutBtn" class="logout-btn">Logout</button></li>
      </ul>
    </nav>
  </div>

  <!-- Wikipedia Search Section -->
  <section class="wiki-section">
    <div class="wiki-container">
      <h2>Search Wikipedia</h2>
      <div class="wiki-search">
        <input type="text" id="searchInput" placeholder="Enter a topic..." />
        <button onclick="searchWiki()">Search</button>
      </div>
      <div id="resultsContainer" class="wiki-results"></div>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal" id="contentModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="fullContent"></div>
    </div>
  </div>

  <script src="/frontend/JS/wikipedia.js"></script>
  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('userEmail');
        window.location.href = '/frontend/index.html';
      });
    }
  </script>
</body>
</html>
