<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LearnHub</title>
  <link rel="stylesheet" href="/frontend/CSS/style.css" />
  <link rel="stylesheet" href="/frontend/CSS/homepage.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="userEmailDisplay" style="font-weight: 600; margin-bottom: 1rem;"></div>
  
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo-container">
      <img src="photos/logo.png" alt="Logo" class="logo" />
      <span class="site-title">LearnHub</span>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="/frontend/index.html">Explore</a></li>
        <li><a href="/frontend/Numberfacts.html">Number Facts</a></li>
        <li><a href="/frontend/wikipedia.html">Wikipedia</a></li>
        <li><a href="/frontend/quiz.html">Quiz</a></li>
        <li><a href="/frontend/scheduler.html">Scheduler</a></li>
        <li><a href="/frontend/logout.html">Logout</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to <span class="highlight">LearnHub!</span></h1>
      <p>Your one-stop platform for coding challenges, encyclopedic search,<br> educational quizzes, and smart scheduling - all in one place.</p>
      <button class="about-button">About LearnHub</button>
    </div>
    <div class="hero-image">
      <div class="image-stack">
        <img class="back" src="photos/Backlines.png" alt="Backlines" />
        <img class="front" src="photos/E-learn.png" alt="E-learning illustration" />
      </div>
    </div>
  </section>

  <!-- CTA -->
  <div class="cta-wrapper">
    <a class="main-button" href="/frontend/index.html">
      Start with the features Now <span class="arrow">➜</span>
    </a>
  </div>
  
  <!-- Background Circuit Decoration -->
  <div class="circuit-background">
    <img src="photos/Circuits.png" alt="Circuit Decoration" />
  </div>

  <script>
  // Check if user is logged in
  const token = localStorage.getItem('authToken');
  if (!token) {
    // Not logged in, redirect to login page
    window.location.href = 'login.html';
  } else {
    // Optionally, display user email somewhere
    const userEmail = localStorage.getItem('userEmail');
    const userDisplay = document.getElementById('userEmailDisplay');
    if (userDisplay && userEmail) {
      userDisplay.textContent = `Logged in as: ${userEmail}`;
    }
    
  }
</script>

</body>
</html>
