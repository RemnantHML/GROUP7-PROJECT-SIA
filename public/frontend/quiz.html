<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate a Quiz - LearnHub</title>
  <link rel="stylesheet" href="/frontend/CSS/style.css">
  <link rel="stylesheet" href="/frontend/CSS/homepage.css">
</head>
<body>
<div id="userEmailDisplay" style="font-weight: 600; margin-bottom: 1rem;"></div>
  <header>
    <div class="navbar">
      <div class="logo-container">
      <img src="/photos/logo.png" alt="Logo" class="logo" />
      <span class="site-title">LearnHub</span>
    </div>
      <nav>
        <ul>
          <li><a href="/frontend/homepage.html">Home</a></li>
          <li><a href="/frontend/explorehub.html">Explore</a></li>
          <li><a href="/frontend/Numberfacts.html">Number Facts</a></li>
          <li><a href="/frontend/wikipedia.html">Wikipedia</a></li>
          <li><a href="/frontend/Dictionary.html">Dictionary</a></li>
          <li><a href="/frontend/scheduler.html">Scheduler</a></li>
          <li><button id="logoutBtn" class="logout-btn">Logout</button></li>
        </ul>
      </nav>
    </div>
  </header>

    <div class="main-content">
  <div class="sidebar" id="sidebar">
    <h3>Categories</h3>
    <!-- JS will populate categories here -->
  </div>
</section>
  <!-- Quiz Generation Section -->
    <div class="quiz-container">
      <h2>Generate a Quiz</h2>
      <form id="generate-form">
        <label for="amount">Number of Questions</label>
        <input type="number" id="amount" name="amount" value="5" min="1" max="20" required>

        <label for="category">Category (ID Number)</label>
        <input type="text" id="category" name="category" placeholder="Enter Category ID">

        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty">
          <option value="">Any</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>

        <label for="type">Type</label>
        <select id="type" name="type">
          <option value="multiple">Multiple Choice</option>
          <option value="boolean">True / False</option>
        </select>

        <button type="submit" class="btn primary">Generate Quiz</button>
      </form>

      <div id="quiz-output" class="quiz-output"></div>
    </div>
  <script src="/frontend/JS/quiz.js"></script>
  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('userEmail');
        window.location.href = '/frontend/index.html';
      });
    }
  </script>
</body>
</html>
