<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Scheduler</title>
  <link rel="stylesheet" href="/frontend/CSS/style.css" />
  <link rel="stylesheet" href="/frontend/CSS/homepage.css">
  <style>
    .logout-btn {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      margin: 0;
      outline: none;
      height: 100%;
      display: inline;
    }
    .nav-links .logout-btn, nav ul .logout-btn, nav .logout-btn {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      margin: 0;
      outline: none;
      height: 100%;
      display: inline;
    }
  </style>
</head>
<body>
  <div id="userEmailDisplay" style="font-weight: 600; margin-bottom: 1rem;"></div>
  <!-- Navbar -->
  <div class="navbar">
    <div class="logo-container">
      <img src="photos/LH_ICON.png" alt="Logo" class="logo" />
      <span class="site-title">LearnHub</span>
    </div>
    <nav>
      <ul>
        <li><a href="/frontend/homepage.html">Home</a></li>
        <li><a href="/frontend/explorehub.html">Explore</a></li>
        <li><a href="/frontend/Numberfacts.html">Number Facts</a></li>
        <li><a href="/frontend/wikipedia.html">Wikipedia</a></li>
        <li><a href="/frontend/Dictionary.html">Dictionary</a></li>
        <li><a href="/frontend/quiz.html">Quiz</a></li>
        <li><button id="logoutBtn" class="logout-btn">Logout</button></li>
      </ul>
    </nav>
  </div>

  <!-- Scheduler Section -->
  <div class="quiz-container scheduler">
    <h2>Study Scheduler</h2>
    <form class="scheduler-form" id="scheduler-form">
      <input type="text" id="title" placeholder="Enter title (e.g., Science:Computing)" required />
      <input type="text" id="description" placeholder="Enter description (e.g., Chapters 10)" required />
      <input type="datetime-local" id="scheduled_at" required />
      <button type="submit">Add Schedule</button>
    </form>

    <!-- Date Filter Section -->
    <div class="filter-container">
      <label for="date-filter">Filter by Date: </label>
      <input type="date" id="date-filter" />
      <button id="filter-btn">Filter</button>
    </div>

    <!-- Task List -->
    <ul class="scheduler-task-list" id="task-list"></ul>
  </div>

  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('userEmail');
        window.location.href = '/frontend/index.html';
      });
    }
  </script>

  <script src="/frontend/JS/scheduler.js"></script>
</body>
</html>
